name: Issue status

# Moves issues through status labels:
#   opened -> status: todo
#   commit referencing #N on a feature branch -> status: in-progress
#   PR merged into develop -> status: in-review
#   PR merged into main    -> status: done (issue closed)

on:
  issues:
    types: [opened]
  push:
    branches-ignore: [main, develop]
  pull_request:
    types: [closed]
    branches: [develop, main]

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: issue-status-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - uses: actions/github-script@v7
        env:
          DEVELOP_BRANCH: develop
          MAIN_BRANCH: main
        with:
          script: |
            const run = require('./.github/scripts/issue-status.js');
            await run({ github, context, core });

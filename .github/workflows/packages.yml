name: Packages

on:
  pull_request:
    branches: [staging, develop, main]
    paths:
      - "packages/**"
      - "docs/api-guidelines.md"
      - "docs/authentication.md"
      - ".spectral.yaml"
      - "apps/core/**"
      - "apps/website/**"
      - "tools/local/**"
      - "tools/staging/**"
      - "docs/srs/**"
      - "docs/data-dictionary.md"
      - "README.md"
      - "Makefile"
      - ".github/workflows/packages.yml"
      - ".github/workflows/deploy-staging.yml"
      - "pnpm-lock.yaml"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "turbo.json"
  workflow_call:
  push:
    branches: [develop, main]
    paths:
      - "packages/**"
      - "docs/api-guidelines.md"
      - "docs/authentication.md"
      - ".spectral.yaml"
      - "apps/core/**"
      - "apps/website/**"
      - "tools/local/**"
      - "tools/staging/**"
      - "docs/srs/**"
      - "docs/data-dictionary.md"
      - "README.md"
      - "Makefile"
      - ".github/workflows/packages.yml"
      - ".github/workflows/deploy-staging.yml"
      - "pnpm-lock.yaml"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "turbo.json"

jobs:
  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify Django API proxy routes are present
        run: |
          test -f apps/website/lib/django-proxy.ts
          test -f apps/website/app/api/auth/login/route.ts
          test -f apps/website/app/api/auth/csrf/route.ts
          test -f apps/website/app/api/public/listings/route.ts
      - run: pnpm --filter @legacy/website lint
      - run: pnpm --filter @legacy/website build

  local-stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f tools/local/docker-compose.yml config -q
      - run: docker compose -f tools/staging/docker-compose.yml config -q
        env:
          DJANGO_SECRET_KEY: ci-placeholder-secret-not-for-reuse
          DJANGO_DEBUG: "0"
          DJANGO_ALLOWED_HOSTS: localhost
          CORS_ALLOWED_ORIGINS: http://localhost
          AUTH_SMS_BACKEND: ""
          POSTGRES_DB: legacy_core
          POSTGRES_USER: legacy
          POSTGRES_PASSWORD: ci-placeholder-password
          RABBITMQ_DEFAULT_USER: ci-placeholder-user
          RABBITMQ_DEFAULT_PASS: ci-placeholder-password
          RABBITMQ_ERLANG_COOKIE: ci-placeholder-cookie
          MINIO_ROOT_USER: ci-placeholder-user
          MINIO_ROOT_PASSWORD: ci-placeholder-password
          OBJECT_STORAGE_ACCESS_KEY: ci-placeholder-access
          OBJECT_STORAGE_SECRET_KEY: ci-placeholder-secret
          OBJECT_STORAGE_BUCKET: legacy-private
          OBJECT_STORAGE_REGION: us-east-1
          STAGING_DOMAIN: localhost

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @legacy/contracts lint
      - run: pnpm --filter @legacy/api-client gen
      - run: pnpm --filter @legacy/api-client test
      - run: git diff --exit-code -- packages/api-client/src/generated/schema.d.ts

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: legacy_core
          POSTGRES_USER: legacy
          POSTGRES_PASSWORD: legacy_local_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U legacy -d legacy_core"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r apps/core/requirements-dev.txt
      - run: ruff check --select E4,E7,E9,F apps/core
      - run: python manage.py check
        working-directory: apps/core
        env:
          DJANGO_SECRET_KEY: local-test-only-not-for-reuse
          DJANGO_DEBUG: "1"
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_DB: legacy_core
          POSTGRES_USER: legacy
          POSTGRES_PASSWORD: legacy_local_only
      - run: python manage.py makemigrations --check --dry-run
        working-directory: apps/core
        env:
          DJANGO_SECRET_KEY: local-test-only-not-for-reuse
          DJANGO_DEBUG: "1"
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_DB: legacy_core
          POSTGRES_USER: legacy
          POSTGRES_PASSWORD: legacy_local_only
      - run: python manage.py migrate --noinput
        working-directory: apps/core
        env:
          DJANGO_SECRET_KEY: local-test-only-not-for-reuse
          DJANGO_DEBUG: "1"
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_DB: legacy_core
          POSTGRES_USER: legacy
          POSTGRES_PASSWORD: legacy_local_only
      - run: python manage.py migrate --check
        working-directory: apps/core
        env:
          DJANGO_SECRET_KEY: local-test-only-not-for-reuse
          DJANGO_DEBUG: "1"
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_DB: legacy_core
          POSTGRES_USER: legacy
          POSTGRES_PASSWORD: legacy_local_only
      - run: python manage.py test
        working-directory: apps/core
        env:
          DJANGO_SECRET_KEY: local-test-only-not-for-reuse
          DJANGO_DEBUG: "1"
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_DB: legacy_core
          POSTGRES_USER: legacy
          POSTGRES_PASSWORD: legacy_local_only

name: Packages

on:
  pull_request:
    branches: [develop, main]
    paths:
      - "packages/**"
      - "docs/api-guidelines.md"
      - "docs/authentication.md"
      - ".spectral.yaml"
      - "apps/core/**"
      - "apps/website/**"
      - "tools/local/**"
      - "docs/srs/**"
      - "docs/data-dictionary.md"
      - "README.md"
      - "Makefile"
      - ".github/workflows/packages.yml"
      - "pnpm-lock.yaml"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "turbo.json"
  push:
    branches: [develop, main]
    paths:
      - "packages/**"
      - "docs/api-guidelines.md"
      - "docs/authentication.md"
      - ".spectral.yaml"
      - "apps/core/**"
      - "apps/website/**"
      - "tools/local/**"
      - "docs/srs/**"
      - "docs/data-dictionary.md"
      - "README.md"
      - "Makefile"
      - ".github/workflows/packages.yml"
      - "pnpm-lock.yaml"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "turbo.json"

jobs:
  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @legacy/website lint
      - run: pnpm --filter @legacy/website build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.invalid
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-build-placeholder
          SUPABASE_SERVICE_ROLE_KEY: ci-build-placeholder

  local-stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f tools/local/docker-compose.yml config -q

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @legacy/contracts lint
      - run: pnpm --filter @legacy/api-client gen
      - run: pnpm --filter @legacy/api-client test
      - run: git diff --exit-code -- packages/api-client/src/generated/schema.d.ts

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: legacy_core
          POSTGRES_USER: legacy
          POSTGRES_PASSWORD: legacy_local_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U legacy -d legacy_core"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r apps/core/requirements-dev.txt
      - run: ruff check --select E4,E7,E9,F apps/core
      - run: python manage.py check
        working-directory: apps/core
        env:
          DJANGO_SECRET_KEY: local-test-only-not-for-reuse
          DJANGO_DEBUG: "1"
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_DB: legacy_core
          POSTGRES_USER: legacy
          POSTGRES_PASSWORD: legacy_local_only
      - run: python manage.py makemigrations --check --dry-run
        working-directory: apps/core
        env:
          DJANGO_SECRET_KEY: local-test-only-not-for-reuse
          DJANGO_DEBUG: "1"
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_DB: legacy_core
          POSTGRES_USER: legacy
          POSTGRES_PASSWORD: legacy_local_only
      - run: python manage.py migrate --noinput
        working-directory: apps/core
        env:
          DJANGO_SECRET_KEY: local-test-only-not-for-reuse
          DJANGO_DEBUG: "1"
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_DB: legacy_core
          POSTGRES_USER: legacy
          POSTGRES_PASSWORD: legacy_local_only
      - run: python manage.py migrate --check
        working-directory: apps/core
        env:
          DJANGO_SECRET_KEY: local-test-only-not-for-reuse
          DJANGO_DEBUG: "1"
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_DB: legacy_core
          POSTGRES_USER: legacy
          POSTGRES_PASSWORD: legacy_local_only
      - run: python manage.py test
        working-directory: apps/core
        env:
          DJANGO_SECRET_KEY: local-test-only-not-for-reuse
          DJANGO_DEBUG: "1"
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_DB: legacy_core
          POSTGRES_USER: legacy
          POSTGRES_PASSWORD: legacy_local_only

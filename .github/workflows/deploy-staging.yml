name: Deploy staging

on:
  push:
    branches: [staging]
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: Deploy the selected branch to the shared staging VPS
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: staging-deployment
  cancel-in-progress: false

jobs:
  checks:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/staging') ||
      (github.event_name == 'workflow_dispatch' && inputs.confirm_deploy)
    uses: ./.github/workflows/packages.yml

  deploy:
    needs: checks
    if: >-
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/staging') ||
        (github.event_name == 'workflow_dispatch' && inputs.confirm_deploy)
      ) &&
      needs.checks.result == 'success'
    name: Deploy staging from ${{ github.ref_name }}
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show deployment source
        run: |
          echo "Deploying ref: $GITHUB_REF"
          echo "Commit: $(git rev-parse --short HEAD)"

      - name: Create deployment archive
        run: git archive --format=tar.gz --output=legacy-real-estate.tar.gz HEAD

      - name: Configure SSH
        env:
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$STAGING_SSH_KEY" > "$HOME/.ssh/staging"
          chmod 600 "$HOME/.ssh/staging"
          ssh-keyscan -H "$STAGING_HOST" >> "$HOME/.ssh/known_hosts"

      - name: Upload source archive
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
        run: |
          scp -i "$HOME/.ssh/staging" legacy-real-estate.tar.gz \
            "$STAGING_USER@$STAGING_HOST:/tmp/legacy-real-estate.tar.gz"

      - name: Sync WhatsApp configuration from GitHub secrets
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          WHATSAPP_BACKEND: ${{ secrets.WHATSAPP_BACKEND }}
          WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_WABA_ID: ${{ secrets.WHATSAPP_WABA_ID }}
          WHATSAPP_APP_SECRET: ${{ secrets.WHATSAPP_APP_SECRET }}
          WHATSAPP_VERIFY_TOKEN: ${{ secrets.WHATSAPP_VERIFY_TOKEN }}
          WHATSAPP_WEBHOOK_TOKEN: ${{ secrets.WHATSAPP_WEBHOOK_TOKEN }}
          MPESA_CONSUMER_KEY: ${{ secrets.MPESA_CONSUMER_KEY }}
          MPESA_CONSUMER_SECRET: ${{ secrets.MPESA_CONSUMER_SECRET }}
          MPESA_SHORTCODE: ${{ secrets.MPESA_SHORTCODE }}
          MPESA_PASSKEY: ${{ secrets.MPESA_PASSKEY }}
          MPESA_BASE_URL: ${{ secrets.MPESA_BASE_URL }}
        run: |
          : > whatsapp.env
          chmod 600 whatsapp.env
          for name in WHATSAPP_BACKEND WHATSAPP_ACCESS_TOKEN \
                      WHATSAPP_PHONE_NUMBER_ID WHATSAPP_WABA_ID \
                      WHATSAPP_APP_SECRET WHATSAPP_VERIFY_TOKEN \
                      WHATSAPP_WEBHOOK_TOKEN \
                      MPESA_CONSUMER_KEY MPESA_CONSUMER_SECRET \
                      MPESA_SHORTCODE MPESA_PASSKEY MPESA_BASE_URL; do
            value="${!name}"
            if [ -n "$value" ]; then
              printf '%s=%s\n' "$name" "$value" >> whatsapp.env
            fi
          done
          if [ -s whatsapp.env ]; then
            scp -i "$HOME/.ssh/staging" whatsapp.env \
              "$STAGING_USER@$STAGING_HOST:/tmp/whatsapp.env"
            ssh -i "$HOME/.ssh/staging" "$STAGING_USER@$STAGING_HOST" \
              'bash -s' <<'REMOTE'
          set -euo pipefail
          touch /srv/legacy-real-estate/.env
          while IFS= read -r line; do
            name="${line%%=*}"
            grep -v "^${name}=" /srv/legacy-real-estate/.env > /tmp/env.merged || true
            printf '%s\n' "$line" >> /tmp/env.merged
            mv /tmp/env.merged /srv/legacy-real-estate/.env
          done < /tmp/whatsapp.env
          chmod 600 /srv/legacy-real-estate/.env
          rm -f /tmp/whatsapp.env
          REMOTE
          else
            echo "No WhatsApp secrets configured; skipping."
          fi
          rm -f whatsapp.env

      - name: Deploy and verify
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
        run: |
          ssh -i "$HOME/.ssh/staging" "$STAGING_USER@$STAGING_HOST" \

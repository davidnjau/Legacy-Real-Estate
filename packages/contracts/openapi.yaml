openapi: 3.1.0
info:
  title: Legacy Real Estate Agency API
  version: 0.1.0
  contact:
    name: Legacy Real Estate API maintainers
  description: >
    Versioned API contract. The initial contract exposes the public service
    health endpoint; business endpoints are added with their authorization,
    validation, audit, and pagination requirements.

servers:
  - url: /api/v1
    description: Current API version

tags:
  - name: System
    description: Service health and operational endpoints.
  - name: Authentication
    description: Session sign-in and current-account endpoints.
  - name: Landlords
    description: Branch-scoped landlord records and management agreements.
  - name: Branches
    description: Branches accessible to the authenticated user.
  - name: Properties
    description: Branch-scoped properties and units.
  - name: Caretakers
    description: Caretaker accounts and property assignments.
  - name: Maintenance
    description: Property maintenance tickets, lifecycle updates, and comments.
  - name: Inspections
    description: Scheduled property inspections and landlord-shareable reports.
  - name: Expenses
    description: Recurring and one-off property expenses with approval workflows.
  - name: Announcements
    description: Branch and property notices for management staff and tenants.
  - name: Vendors
    description: Branch-scoped maintenance vendor and fundi records.
  - name: Tenancies
    description: Branch-scoped tenancy records and terms.
  - name: Tenant portal
    description: Tenant-scoped rental dashboard, billing history, and receipts.
  - name: Move-outs
    description: Notice, exit inspection, deposit settlement approval, and payout workflows.
  - name: Billing
    description: Immutable invoices and financial records.
security:
  - SessionCookieAuth: []

paths:
  /health:
    get:
      operationId: getHealth
      summary: Health check
      description: Public liveness response. It contains no dependency or account data.
      tags:
        - System
      security: []
      responses:
        "200":
          description: Service is responding
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              examples:
                healthy:
                  value:
                    status: ok
  /auth/csrf:
    get:
      operationId: getAuthCsrfToken
      summary: Obtain a CSRF token
      description: Sets the CSRF cookie and returns its request-header token.
      tags:
        - Authentication
      security: []
      responses:
        "200":
          description: CSRF token issued
          content:
            application/json:
              schema:
                type: object
                required:
                  - csrfToken
                properties:
                  csrfToken:
                    type: string
  /auth/login:
    post:
      operationId: login
      summary: Start a session
      description: >
        Requires the CSRF cookie and X-CSRFToken header. Staff use email and
        password. Director and finance-role users must verify their authenticator
        before a staff session is established.
      tags:
        - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - identifier
                - password
              properties:
                identifier:
                  type: string
                  description: Email address or international-format mobile number.
                password:
                  type: string
                  format: password
      responses:
        "200":
          description: Signed in without an additional challenge
          content:
            application/json:
              schema:
                type: object
                required:
                  - user
                properties:
                  user:
                    $ref: "#/components/schemas/AuthUser"
        "202":
          description: Authenticator verification is required
          content:
            application/json:
              schema:
                type: object
                required:
                  - mfa_required
                  - challenge_id
                properties:
                  mfa_required:
                    type: boolean
                    const: true
                  challenge_id:
                    type: integer
  /auth/phone-otp/request:
    post:
      operationId: requestPhoneLoginOtp
      summary: Request a tenant or landlord sign-in code
      description: >
        Queues an SMS code for an active linked tenant or landlord account.
        The response does not reveal whether the phone number belongs to an
        account. Codes expire after five minutes, allow five attempts, and
        can be requested once every 60 seconds.
      tags:
        - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - phone
              properties:
                phone:
                  type: string
                  description: Kenyan phone number in local or international format.
      responses:
        "202":
          description: Request accepted without disclosing account existence
          content:
            application/json:
              schema:
                type: object
                required:
                  - challenge_id
                  - expires_in_seconds
                  - resend_after_seconds
                  - message
                properties:
                  challenge_id:
                    type: integer
                  expires_in_seconds:
                    type: integer
                    const: 300
                  resend_after_seconds:
                    type: integer
                    const: 60
                  message:
                    type: string
        "400":
          $ref: "#/components/responses/Problem"
        "429":
          description: Resend cooldown has not elapsed
          content:
            application/json:
              schema:
                type: object
                required:
                  - error
                  - retry_after_seconds
                properties:
                  error:
                    type: string
                    const: otp-resend-cooldown
                  retry_after_seconds:
                    type: integer
        "503":
          $ref: "#/components/responses/Problem"
  /auth/phone-otp/verify:
    post:
      operationId: verifyPhoneLoginOtp
      summary: Verify a tenant or landlord sign-in code
      description: >
        Establishes a 12-hour same-device session restricted to tenant and
        landlord APIs. Accounts with staff roles must complete a fresh staff
        sign-in before accessing staff workspaces.
      tags:
        - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - challenge_id
                - code
              properties:
                challenge_id:
                  type: integer
                code:
                  type: string
                  pattern: "^[0-9]{6}$"
      responses:
        "200":
          description: Code verified and residential session established
          content:
            application/json:
              schema:
                type: object
                required:
                  - user
                  - session_expires_in_seconds
                properties:
                  user:
                    $ref: "#/components/schemas/AuthUser"
                  session_expires_in_seconds:
                    type: integer
                    const: 43200
        "400":
          $ref: "#/components/responses/Problem"
  /auth/landlord/activate/context:
    get:
      operationId: getLandlordActivationContext
      summary: Resolve a landlord activation challenge
      description: Returns whether the SMS challenge activates a new account or links an existing account.
      tags:
        - Authentication
      security: []
      parameters:
        - name: challenge_id
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Landlord activation context
          content:
            application/json:
              schema:
                type: object
                required: [existing_account, identity_confirmation_required]
                properties:
                  existing_account: {type: boolean}
                  identity_confirmation_required: {type: boolean}
        "404":
          $ref: "#/components/responses/Problem"
  /auth/landlord/activate:
    post:
      operationId: activateLandlord
      summary: Activate or link a landlord account
      description: >
        Verifies the SMS activation code. Existing-account links additionally
        require the ID or registration number already recorded for the landlord.
        New accounts are activated without a password and must sign in with phone OTP.
      tags:
        - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [challenge_id, code]
              properties:
                challenge_id: {type: string}
                code:
                  type: string
                  pattern: "^[0-9]{6}$"
                id_or_registration_number:
                  type: string
                  description: Required when the challenge context indicates an existing account.
      responses:
        "200":
          description: Landlord account activated or linked
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: {type: string, const: activated}
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
  /auth/password-reset:
    post:
      operationId: requestPasswordReset
      summary: Request a password reset link
      description: >
        Sends a single-use reset link when an active account uses the supplied
        email. The response is the same when no account matches. Requires the
        CSRF cookie and X-CSRFToken header.
      tags:
        - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        "200":
          description: Request accepted
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - message
                properties:
                  success:
                    type: boolean
                    const: true
                  message:
                    type: string
        "400":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /auth/password-reset/confirm:
    post:
      operationId: confirmPasswordReset
      summary: Set a new password with a reset token
      description: Requires the CSRF cookie and X-CSRFToken header.
      tags:
        - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - uid
                - token
                - password
              properties:
                uid:
                  type: string
                token:
                  type: string
                password:
                  type: string
                  format: password
      responses:
        "200":
          description: Password updated
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - message
                properties:
                  success:
                    type: boolean
                    const: true
                  message:
                    type: string
        "400":
          $ref: "#/components/responses/Problem"
  /auth/mfa/verify:
    post:
      operationId: verifyAuthSmsChallenge
      summary: Verify a sign-in code
      description: Requires the CSRF cookie and X-CSRFToken header.
      tags:
        - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - challenge_id
                - code
              properties:
                challenge_id:
                  type: integer
                code:
                  type: string
                  pattern: "^[0-9]{6}$"
      responses:
        "200":
          description: Challenge verified and session established
          content:
            application/json:
              schema:
                type: object
                required:
                  - user
                properties:
                  user:
                    $ref: "#/components/schemas/AuthUser"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
  /auth/me:
    get:
      operationId: getCurrentUser
      summary: Get the authenticated user
      description: Returns the account, role names, and branches available to the current session.
      tags:
        - Authentication
      responses:
        "200":
          description: Current account information
          content:
            application/json:
              schema:
                type: object
                required:
                  - user
                properties:
                  user:
                    $ref: "#/components/schemas/AuthUser"
        "401":
          $ref: "#/components/responses/Problem"
  /landlord/profile:
    get:
      operationId: getLandlordPortalProfile
      summary: Get the landlord's portal profile
      description: Returns the authenticated landlord's profile fields.
      tags:
        - Landlords
      responses:
        "200":
          description: Landlord profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalProfileResponse"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateLandlordPortalProfile
      summary: Update the landlord's portal profile
      description: Updates profile name and Kenyan mobile number for the authenticated landlord.
      tags:
        - Landlords
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PortalProfileUpdate"
      responses:
        "200":
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalProfileUpdateResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
  /landlord/onboarding:
    get:
      operationId: getLandlordOnboarding
      summary: Get landlord onboarding state
      description: Returns onboarding/tutorial flags and the landlord's first property name.
      tags:
        - Landlords
      responses:
        "200":
          description: Onboarding state and initial property name
          content:
            application/json:
              schema:
                type: object
                required:
                  - fullName
                  - propertyName
                  - onboardingCompleted
                  - tutorialCompleted
                properties:
                  fullName:
                    type: string
                  propertyName:
                    type: string
                  onboardingCompleted:
                    type: boolean
                  tutorialCompleted:
                    type: boolean
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
    post:
      operationId: completeLandlordOnboarding
      summary: Complete landlord onboarding
      description: Marks onboarding complete and saves the submitted tutorial state.
      tags:
        - Landlords
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                tutorialCompleted:
                  type: boolean
      responses:
        "200":
          description: Onboarding state saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalOnboardingResponse"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
  /caretaker/profile:
    get:
      operationId: getCaretakerPortalProfile
      summary: Get the caretaker's portal profile
      description: Returns the authenticated caretaker's profile and account status.
      tags:
        - Caretakers
      responses:
        "200":
          description: Caretaker profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalProfileResponse"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateCaretakerPortalProfile
      summary: Update the caretaker's portal profile
      description: Updates the authenticated caretaker's name, email, and Kenyan mobile number.
      tags:
        - Caretakers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PortalProfileUpdate"
      responses:
        "200":
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalProfileUpdateResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
  /caretaker/onboarding:
    get:
      operationId: getCaretakerOnboarding
      summary: Get caretaker onboarding state
      description: Returns the authenticated caretaker's onboarding and tutorial flags.
      tags:
        - Caretakers
      responses:
        "200":
          description: Onboarding state
          content:
            application/json:
              schema:
                type: object
                required:
                  - fullName
                  - tutorialCompleted
                properties:
                  fullName:
                    type: string
                  tutorialCompleted:
                    type: boolean
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
    post:
      operationId: completeCaretakerOnboarding
      summary: Complete caretaker onboarding
      description: Marks onboarding complete and saves the submitted tutorial state.
      tags:
        - Caretakers
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                tutorialCompleted:
                  type: boolean
      responses:
        "200":
          description: Onboarding state saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalOnboardingResponse"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
  /auth/logout:
    post:
      operationId: logout
      summary: End the current session
      description: Requires the session cookie and X-CSRFToken header.
      tags:
        - Authentication
      responses:
        "200":
          description: Session ended
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    const: ok
        "401":
          $ref: "#/components/responses/Problem"
  /auth/register-tenant:
    post:
      operationId: registerTenantPortal
      summary: Create a resident portal account
      description: Creates a tenant-role account and session without creating or assigning a tenancy.
      tags:
        - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, email, phone, password]
              properties:
                name:
                  type: string
                  maxLength: 255
                email:
                  type: string
                  format: email
                  maxLength: 150
                phone:
                  type: string
                password:
                  type: string
                  format: password
                  minLength: 12
      responses:
        "201":
          description: Resident account and session created; agency linkage is pending.
          content:
            application/json:
              schema:
                type: object
                required: [user, status]
                properties:
                  user:
                    $ref: "#/components/schemas/AuthUser"
                  status:
                    type: string
                    const: awaiting_agency_linkage
        "400":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /caretaker-invitations:
    get:
      operationId: listCaretakerInvitations
      summary: List caretaker invitations and assignments
      description: Returns invitations and active caretaker assignments limited to properties owned by the current landlord account.
      tags:
        - Caretakers
      parameters:
        - name: property_id
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Invitations and active caretaker assignments for owned properties
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
    post:
      operationId: createCaretakerInvitation
      summary: Create a caretaker invitation
      description: Returns a raw one-time activation token; only its hash is stored.
      tags:
        - Caretakers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [property_id, email]
              properties:
                property_id:
                  type: integer
                email:
                  type: string
                  format: email
      responses:
        "201":
          description: Invitation created and activation token returned
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /caretaker-invitations/verify:
    get:
      operationId: verifyCaretakerInvitation
      summary: Resolve a caretaker invitation
      description: Validates an unexpired, unused invitation token and returns its email and property context.
      tags:
        - Caretakers
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Invitation email and property context
        "400":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /caretaker-invitations/complete:
    post:
      operationId: activateCaretakerInvitation
      summary: Create and activate a caretaker account
      description: Consumes an invitation and transactionally creates the caretaker account and property assignment.
      tags:
        - Caretakers
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token, name, phone, password]
              properties:
                token:
                  type: string
                name:
                  type: string
                phone:
                  type: string
                password:
                  type: string
                  format: password
                  minLength: 12
      responses:
        "201":
          description: Caretaker account and property assignment created; session established
        "400":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /caretaker-invitations/{invitation_id}/resend:
    post:
      operationId: resendCaretakerInvitation
      summary: Regenerate a caretaker activation token
      description: Invalidates the previous link and returns a replacement token with a new 48-hour expiry.
      tags:
        - Caretakers
      parameters:
        - name: invitation_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: New one-time activation token returned
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /caretaker-invitations/revoke:
    post:
      operationId: revokeCaretakerPropertyAccess
      summary: End a caretaker's assignment to a property
      description: Ends the active assignment without deleting the caretaker account or its other assignments.
      tags:
        - Caretakers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [property_id, caretaker_id]
              properties:
                property_id:
                  type: integer
                caretaker_id:
                  type: integer
      responses:
        "200":
          description: Caretaker property assignment ended
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /branches:
    get:
      operationId: listAccessibleBranches
      summary: List accessible branches
      description: Returns only branches assigned to the authenticated user.
      tags:
        - Branches
      responses:
        "200":
          description: Accessible branches
          content:
            application/json:
              schema:
                type: object
                required:
                  - branches
                properties:
                  branches:
                    type: array
                    items:
                      $ref: "#/components/schemas/Branch"
        "401":
          $ref: "#/components/responses/Problem"
  /branches/{branch_id}:
    get:
      operationId: getAccessibleBranch
      summary: Get an accessible branch
      description: Returns a branch only when it is in the caller's access scope.
      tags:
        - Branches
      parameters:
        - name: branch_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Accessible branch
          content:
            application/json:
              schema:
                type: object
                required:
                  - branch
                properties:
                  branch:
                    $ref: "#/components/schemas/Branch"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /director/branches:
    get:
      operationId: listAgencyBranches
      summary: List branches for a Director's agency
      description: Lists branches in the agency where the authenticated user has an active Director membership.
      tags:
        - Branches
      parameters:
        - name: agency_id
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Agency branches
          content:
            application/json:
              schema:
                type: object
                required: [branches]
                properties:
                  branches:
                    type: array
                    items:
                      $ref: "#/components/schemas/Branch"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
    post:
      operationId: createAgencyBranch
      summary: Create an agency branch
      description: Creates a branch for an agency where the authenticated user has an active Director membership.
      tags:
        - Branches
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [agency_id, name, town]
              properties:
                agency_id:
                  type: integer
                name:
                  type: string
                  maxLength: 100
                town:
                  type: string
                  maxLength: 100
      responses:
        "201":
          description: Branch created
          content:
            application/json:
              schema:
                type: object
                required: [branch]
                properties:
                  branch:
                    $ref: "#/components/schemas/Branch"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /landlord/dashboard:
    get:
      operationId: getLandlordDashboard

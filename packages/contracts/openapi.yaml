              schema:
                type: object
                required: [tenancy_id, unit_status, start_date, invoice]
                properties:
                  tenancy_id:
                    type: integer
                  unit_status:
                    type: string
                    enum: [vacant, booked, occupied, maintenance]
                  start_date:
                    type: string
                    format: date
                  invoice:
                    type: object
                    required: [id, number, total, confirmed_paid, recorded_amount, outstanding, status, payments]
                    properties:
                      id: {type: integer}
                      number: {type: string}
                      total: {type: string}
                      confirmed_paid: {type: string}
                      recorded_amount: {type: string}
                      outstanding: {type: string}
                      status:

      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri-reference
          description: Identifier for the problem type.
        title:
          type: string
          description: Short, stable summary of the problem.
        status:
          type: integer
          description: HTTP status code for this occurrence.
        detail:
          type: string
          description: Safe, human-readable explanation specific to this occurrence.
        instance:
          type: string
          format: uri-reference
          description: Identifier for this occurrence, if available.
        request_id:
          type: string
          description: Request correlation identifier, if available.

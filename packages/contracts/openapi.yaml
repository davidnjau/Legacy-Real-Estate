components:
  securitySchemes:
    SessionCookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
      description: >
        Django session cookie established by the login endpoints. Unsafe
        requests must also send the CSRF token in the X-CSRFToken header.
    CsrfToken:
      type: apiKey
      in: header
      name: X-CSRFToken
      description: >
        Django CSRF token returned by GET /auth/csrf. Send it on state-changing
        requests together with the CSRF cookie and session cookie.
  parameters:
    Limit:
      name: limit
      in: query
      description: Maximum number of returned items. Defaults to 50.
      schema:
        type: integer
        default: 50
        minimum: 1
        maximum: 100
    Offset:
      name: offset
      in: query
      description: Zero-based position of the first returned item.
      schema:
        type: integer
        default: 0
        minimum: 0
  schemas:
    PropertyInput:
      type: object
      required: [branch_id, name, property_type, location]
      properties:
        branch_id:
          type: integer
        landlord_id:
          type: integer
          nullable: true
        name:
          type: string
        property_type:
          type: string
        location:
          type: string
        gps_coordinates:
          type: object
        amenities:
          type: array
          items: {}
        house_rules:
          type: object
        photos:
          type: array
          items:
            type: string
        caretaker_ids:
          type: array
          items:
            type: integer
    Property:
      allOf:
        - $ref: "#/components/schemas/PropertyInput"
        - type: object
          required: [id, branch_id]
          properties:
            id:
              type: integer
            blocks:
              type: array
              items:
                type: object
            caretaker_ids:
              type: array
              items:
                type: integer
            caretakers:
              type: array
              items:
                $ref: "#/components/schemas/Caretaker"
            documents:
              type: array
              items:
                type: object
    CaretakerInput:
      type: object
      required: [email, name, password, branch_ids]
      properties:
        email: {type: string, format: email}
        name: {type: string}
        phone: {type: string}
        password: {type: string, format: password, minLength: 12}
        branch_ids:
          type: array
          minItems: 1
          items: {type: integer}
    Caretaker:
      type: object
      required: [id, email, name, phone, branch_ids, is_active]
      properties:
        id: {type: integer}
        email: {type: string, format: email}
        name: {type: string}
        phone: {type: string}
        is_active: {type: boolean}
        branch_ids:
          type: array
          items: {type: integer}
    CaretakerMeterReadingInput:
      type: object
      required: [unit_id, meter, period, previous_value, current_value]
      properties:
        unit_id: {type: integer}
        meter: {type: string}
        period: {type: string, format: date}
        previous_value: {type: number, minimum: 0}
        current_value: {type: number, minimum: 0}
        photo_key: {type: string}
        photo_metadata: {type: object}
    MaintenanceTicketInput:
      type: object
      required: [property_id, title, description, category]
      properties:
        property_id: {type: integer}
        unit_id: {type: integer}
        title: {type: string}
        description: {type: string}
        category:
          type: string
          enum: [plumbing, electrical, structural, security, other]
        priority:
          type: string
          enum: [low, normal, high, urgent]
          default: normal
        photos:
          type: array
          items: {type: object}
        vendor_id: {type: integer}
    VendorInput:
      type: object
      required: [branch_id, name, trade, phone]
      properties:
        branch_id: {type: integer}
        name: {type: string}
        trade: {type: string}
        phone: {type: string}
        email: {type: string, format: email}
        mpesa_number: {type: string}
        rating: {type: number, minimum: 0, maximum: 5}
        notes: {type: string}
    VendorUpdate:
      type: object
      properties:
        name: {type: string}
        trade: {type: string}
        phone: {type: string}
        email: {type: string, format: email}

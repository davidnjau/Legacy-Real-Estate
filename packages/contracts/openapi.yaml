      type: object
      description: Offset pagination metadata for collection responses.
      additionalProperties: false
      required:
        - limit
        - offset
        - count
        - total
      properties:
        limit:
          type: integer
          minimum: 1
          maximum: 100
          description: Maximum number of returned items.
        offset:
          type: integer
          minimum: 0
          description: Zero-based position of the first returned item.
        count:
          type: integer
          minimum: 0
          description: Number of items in this response page.
        total:
          type: integer
          minimum: 0
          description: Total matching items before pagination.

            schema:
              type: object
              required: [document_type, name, file]
              properties:
                document_type:
                  type: string
                  enum: [signed_agreement, identity_document, proof_of_payment, other]
                name:
                  type: string
                  maxLength: 255
                tenancy_id:
                  type: integer
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: Document uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  document:
                    type: object
                    required: [id, document_type, name, download_path]
                    properties:
                      id: {type: integer}
                      document_type: {type: string}
                      name: {type: string}
                      download_path: {type: string}
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /tenants/{tenant_id}/documents/{document_id}:
    get:
      operationId: getTenantDocument
      summary: Download a private tenant document
      description: Streams a tenant document only to authorized staff within the tenant's property scope.
      tags:
        - Properties
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema:
            type: integer
        - name: document_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Private tenant document
          headers:
            Cache-Control:
              schema: {type: string}
            X-Content-Type-Options:
              schema: {type: string}
          content:
            application/pdf:
              schema: {type: string, format: binary}
            image/jpeg:
              schema: {type: string, format: binary}
            image/png:
              schema: {type: string, format: binary}
            image/webp:
              schema: {type: string, format: binary}
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /inspections:
    get:
      operationId: listInspections
      summary: List scheduled inspections
      description: Returns inspections within the authenticated user's property scope.
      tags:
        - Inspections
      parameters:
        - name: property_id
          in: query
          schema: {type: integer}
        - name: status
          in: query
          schema: {type: string}
      responses:
        "200":
          description: Inspection list
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
  /inspections/create:
    post:
      operationId: createInspection
      summary: Schedule an inspection
      description: Schedules a property inspection with responsible staff, checklist, and photo metadata.
      tags:
        - Inspections
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InspectionInput"
      responses:
        "201":
          description: Inspection scheduled
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
  /inspections/{inspection_id}/complete:
    post:
      operationId: completeInspection
      summary: Complete an inspection
      description: Records checklist results, photo metadata, findings, and recommendations.
      tags:
        - Inspections
      parameters:
        - name: inspection_id
          in: path
          required: true
          schema: {type: integer}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InspectionCompletionInput"
      responses:
        "200":
          description: Inspection completed
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /inspections/{inspection_id}/share:
    post:
      operationId: shareInspectionReport
      summary: Share an inspection report
      description: Enables an opaque share token for a completed inspection report.
      tags:
        - Inspections
      parameters:
        - name: inspection_id
          in: path
          required: true
          schema: {type: integer}
      responses:
        "200":
          description: Report sharing enabled
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /inspections/{inspection_id}/report:
    get:
      operationId: getInspectionReport
      summary: Get an inspection report
      description: Returns a completed report for an inspection within the user's property scope.
      tags:
        - Inspections
      parameters:
        - name: inspection_id
          in: path
          required: true
          schema: {type: integer}
      responses:
        "200":
          description: Inspection report
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /inspection-reports/{share_token}:
    get:
      operationId: getSharedInspectionReport
      summary: Get a shared inspection report
      description: Returns a completed inspection report using its opaque share token.
      security: []
      tags:
        - Inspections
      parameters:
        - name: share_token
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Shared inspection report
        "404":
          $ref: "#/components/responses/Problem"
  /property-expenses:
    get:
      operationId: listPropertyExpenses
      summary: List property expenses
      description: Returns submitted, approved, and rejected expenses within the authenticated user's property scope.
      tags:
        - Expenses
      parameters:
        - name: property_id
          in: query
          schema: {type: integer}
        - name: status
          in: query
          schema: {type: string}
      responses:
        "200":
          description: Property expense list
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
  /property-expenses/create:
    post:
      operationId: createPropertyExpense
      summary: Submit a property expense
      description: Records a one-off or recurring expense with an effective period and optional vendor.
      tags:
        - Expenses
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PropertyExpenseInput"
      responses:
        "201":
          description: Property expense submitted
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
  /property-expenses/{expense_id}/approval:
    post:
      operationId: approvePropertyExpense
      summary: Approve or reject a property expense
      description: Applies the management-agreement expense threshold and records the approval actor or rejection reason.
      tags:
        - Expenses
      parameters:
        - name: expense_id
          in: path
          required: true
          schema: {type: integer}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                approved: {type: boolean, default: true}
                rejection_reason: {type: string}
      responses:
        "200":
          description: Expense decision recorded
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /announcements:
    get:
      operationId: listAnnouncements
      summary: List announcements
      description: Returns management announcements in scope or published notices relevant to the authenticated tenant.
      tags:
        - Announcements
      parameters:
        - name: property_id
          in: query
          schema: {type: integer}
        - name: status
          in: query
          schema: {type: string}
      responses:
        "200":
          description: Announcement list
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
  /announcements/create:
    post:
      operationId: createAnnouncement
      summary: Create an announcement
      description: Creates a draft branch-wide or property-specific notice.
      tags:
        - Announcements
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnnouncementInput"
      responses:
        "201":
          description: Announcement created
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
  /announcements/{announcement_id}/publish:
    post:
      operationId: publishAnnouncement
      summary: Publish an announcement
      description: Publishes a draft notice immediately or at the supplied publication time.
      tags:
        - Announcements
      parameters:
        - name: announcement_id
          in: path
          required: true
          schema: {type: integer}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                publish_at: {type: string, format: date-time}
      responses:
        "200":
          description: Announcement published
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
components:
  securitySchemes:
    SessionCookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
      description: >
        Django session cookie established by the login endpoints. Unsafe
        requests must also send the CSRF token in the X-CSRFToken header.
    CsrfToken:
      type: apiKey
      in: header
      name: X-CSRFToken
      description: >
        Django CSRF token returned by GET /auth/csrf. Send it on state-changing
        requests together with the CSRF cookie and session cookie.
  parameters:
    Limit:
      name: limit
      in: query
      description: Maximum number of returned items. Defaults to 50.
      schema:
        type: integer
        default: 50
        minimum: 1
        maximum: 100
    Offset:
      name: offset
      in: query
      description: Zero-based position of the first returned item.
      schema:
        type: integer
        default: 0
        minimum: 0
  schemas:
    PropertyInput:
      type: object
      required: [branch_id, name, property_type, location]
      properties:
        branch_id:
          type: integer
        landlord_id:
          type: integer
          nullable: true
        name:
          type: string
        property_type:
          type: string
        location:
          type: string
        gps_coordinates:
          type: object
        amenities:
          type: array
          items: {}
        house_rules:
          type: object
        photos:
          type: array
          items:
            type: string
        caretaker_ids:
          type: array
          items:
            type: integer
    Property:
      allOf:
        - $ref: "#/components/schemas/PropertyInput"
        - type: object
          required:
            - id
            - branch_id
            - landlord_id
            - address
            - currency_code
            - timezone
            - rent_due_day
            - billing_mode
            - default_rent
            - security_deposit
            - water_deposit
            - default_garbage_charge
            - default_water_rate
          properties:
            id:
              type: integer
            landlord_id:
              type: [integer, "null"]
            address:
              type: [string, "null"]
            currency_code:
              type: string
              pattern: "^[A-Z]{3}$"
            timezone:
              type: string
            rent_due_day:
              type: integer
              minimum: 1
              maximum: 28
            billing_mode:
              type: string
              enum: [metered_water, fixed_utilities]
            default_rent:
              type: string
            security_deposit:
              type: string
            water_deposit:
              type: string
            default_garbage_charge:
              type: string
            default_water_rate:
              type: string
            blocks:
              type: array
              items:
                type: object
            caretaker_ids:
              type: array
              items:
                type: integer
            caretakers:
              type: array
              items:
                $ref: "#/components/schemas/Caretaker"
            documents:
              type: array
              items:
                type: object
    PropertyBillingSettings:
      type: object
      required:
        - paybill_number
        - account_number
        - universal_security_deposit
        - universal_water_deposit
        - first_online_billing_month
      properties:
        paybill_number:
          type: string
          maxLength: 32
        account_number:
          type: string
          maxLength: 64
        universal_security_deposit:
          type: string
        universal_water_deposit:
          type: string
        first_online_billing_month:
          type: [string, "null"]
          pattern: "^\\d{4}-(0[1-9]|1[0-2])$"
    PropertyRecurringCharge:
      type: object
      required: [id, name, amount, is_active]
      properties:
        id:
          type: integer
        name:
          type: string
          maxLength: 80
        amount:
          type: string
        is_active:
          type: boolean
    PropertyRecurringChargeInput:
      type: object
      required: [name, amount]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        amount:
          oneOf:
            - type: number
              minimum: 0
            - type: string
              pattern: "^\\d+(\\.\\d{1,2})?$"
        isActive:
          type: boolean
    LandlordPropertyCreateInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        address:
          type: string
          maxLength: 255
        location:
          type: string
          maxLength: 255
        propertyType:
          type: string
          maxLength: 100
          default: residential
        currencyCode:
          type: string
          pattern: "^[A-Za-z]{3}$"
          default: KES
        timezone:
          type: string
          maxLength: 64
          default: Africa/Nairobi
        rentDueDay:
          type: integer
          minimum: 1
          maximum: 28
          default: 10
        billingMode:
          type: string
          enum: [metered_water, fixed_utilities]
          default: metered_water
        defaultRent:
          oneOf:
            - type: number
              minimum: 0
            - type: string
              pattern: "^\\d+(\\.\\d{1,2})?$"
        securityDeposit:
          oneOf:
            - type: number
              minimum: 0
            - type: string
              pattern: "^\\d+(\\.\\d{1,2})?$"
        waterDeposit:
          oneOf:
            - type: number
              minimum: 0
            - type: string
              pattern: "^\\d+(\\.\\d{1,2})?$"
        garbageCharge:
          oneOf:
            - type: number
              minimum: 0
            - type: string
              pattern: "^\\d+(\\.\\d{1,2})?$"
        waterRate:
          oneOf:
            - type: number
              minimum: 0
            - type: string
              pattern: "^\\d+(\\.\\d{1,4})?$"
        recurringCharges:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/PropertyRecurringChargeInput"
    LandlordPropertyUpdateInput:
      oneOf:
        - type: object
          required: [activePropertyId]
          additionalProperties: false
          properties:
            activePropertyId:
              type: integer
        - type: object
          required: [propertyId]
          anyOf:
            - required: [name]
            - required: [address]
            - required: [location]
            - required: [propertyType]
            - required: [currencyCode]
            - required: [timezone]
            - required: [rentDueDay]
            - required: [billingMode]
            - required: [defaultRent]
            - required: [securityDeposit]
            - required: [waterDeposit]
            - required: [garbageCharge]
            - required: [waterRate]
            - required: [recurringCharges]
          properties:
            propertyId:
              type: integer
            name:
              type: string
              minLength: 1
              maxLength: 120
            address:
              type: string
              maxLength: 255
            location:
              type: string
              maxLength: 255
            propertyType:
              type: string
              maxLength: 100
            currencyCode:
              type: string
              pattern: "^[A-Za-z]{3}$"
            timezone:
              type: string
              maxLength: 64
            rentDueDay:
              type: integer
              minimum: 1
              maximum: 28
            billingMode:
              type: string
              enum: [metered_water, fixed_utilities]
            defaultRent:
              oneOf:
                - type: number
                  minimum: 0
                - type: string
                  pattern: "^\\d+(\\.\\d{1,2})?$"
            securityDeposit:
              oneOf:
                - type: number
                  minimum: 0
                - type: string
                  pattern: "^\\d+(\\.\\d{1,2})?$"
            waterDeposit:
              oneOf:
                - type: number
                  minimum: 0
                - type: string
                  pattern: "^\\d+(\\.\\d{1,2})?$"
            garbageCharge:
              oneOf:
                - type: number
                  minimum: 0
                - type: string
                  pattern: "^\\d+(\\.\\d{1,2})?$"
            waterRate:
              oneOf:
                - type: number
                  minimum: 0
                - type: string
                  pattern: "^\\d+(\\.\\d{1,4})?$"
            recurringCharges:
              type: array
              maxItems: 20
              items:
                $ref: "#/components/schemas/PropertyRecurringChargeInput"
    CaretakerInput:
      type: object
      required: [email, name, password, branch_ids]
      properties:
        email: {type: string, format: email}
        name: {type: string}
        phone: {type: string}
        password: {type: string, format: password, minLength: 12}
        branch_ids:
          type: array
          minItems: 1
          items: {type: integer}
    Caretaker:
      type: object
      required: [id, email, name, phone, branch_ids, is_active]
      properties:
        id: {type: integer}
        email: {type: string, format: email}
        name: {type: string}
        phone: {type: string}
        is_active: {type: boolean}
        branch_ids:
          type: array
          items: {type: integer}
    CaretakerMeterReadingInput:
      type: object
      required: [unit_id, meter, period, previous_value, current_value]
      properties:
        unit_id: {type: integer}
        meter: {type: string}
        period: {type: string, format: date}
        previous_value: {type: number, minimum: 0}
        current_value: {type: number, minimum: 0}
        photo_key: {type: string}
        photo_metadata: {type: object}
    MaintenanceTicketInput:
      type: object
      required: [property_id, title, description, category]
      properties:
        property_id: {type: integer}
        unit_id: {type: integer}
        title: {type: string}
        description: {type: string}
        category:
          type: string
          enum: [plumbing, electrical, structural, security, other]
        priority:
          type: string
          enum: [low, normal, high, urgent]
          default: normal
        photos:
          type: array
          items: {type: object}
        vendor_id: {type: integer}
    TenantMaintenanceTicketInput:
      type: object
      required: [category, description, priority]
      properties:
        category:
          type: string
          enum: [plumbing, electrical, structural, security, other]
        description:
          type: string
          minLength: 1
          maxLength: 5000
        priority:
          type: string
          enum: [low, normal, high, urgent]
          default: normal
        evidence:
          type: array
          maxItems: 5
          items:
            type: string
            format: binary
          description: Each image may be up to 5 MB; total evidence is limited to 20 MB.
    TenantMaintenanceTicket:
      type: object
      required: [id, title, description, category, priority, status, created_at, updated_at, evidence]
      properties:
        id: {type: integer}
        title: {type: string}
        description: {type: string}
        category: {type: string, enum: [plumbing, electrical, structural, security, other]}
        priority: {type: string, enum: [low, normal, high, urgent]}
        status:
          type: string
          enum: [open, assigned, quotation, awaiting_landlord_approval, in_progress, completed, closed]
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        evidence:
          type: array
          items:
            type: object
            required: [name, content_type, size_bytes, download_path]
            properties:
              name: {type: string}
              content_type: {type: string, enum: [image/jpeg, image/png, image/webp]}
              size_bytes: {type: integer, minimum: 1, maximum: 5242880}
              download_path: {type: string}
    TenantMaintenanceComment:
      type: object
      required: [id, sender_role, sender_name, message, created_at]
      properties:
        id: {type: integer}
        sender_role: {type: string, enum: [tenant, staff]}
        sender_name: {type: string}
        message: {type: string}
        created_at: {type: string, format: date-time}
    MaintenanceTicketComment:
      type: object
      required: [id, sender_role, sender_name, message, created_at]
      properties:
        id: {type: integer}
        sender_role: {type: string, enum: [tenant, landlord, caretaker]}
        sender_name: {type: string}
        message: {type: string}
        created_at: {type: string, format: date-time}
    MaintenanceLedgerEntry:
      type: object
      required: [id, ticket_id, unit_code, tenant_name, category, description, fundi_name, cost, resolved_at]
      properties:
        id: {type: integer}
        ticket_id: {type: string}
        unit_code: {type: string}
        tenant_name: {type: string}
        category: {type: string}
        description: {type: string}
        fundi_name: {type: string}
        cost: {type: string, nullable: true, pattern: '^\d+(\.\d{1,2})?$'}
        resolved_at: {type: string, format: date-time}
    MaintenanceLedger:
      type: object
      required: [month, summary, ledger]
      properties:
        month: {type: string, pattern: '^\d{4}-\d{2}$'}
        summary:
          type: object
          required: [total_spend, total_repairs]
          properties:
            total_spend: {type: string, pattern: '^\d+(\.\d{1,2})?$'}
            total_repairs: {type: integer, minimum: 0}
        ledger:
          type: array
          items:
            $ref: "#/components/schemas/MaintenanceLedgerEntry"
    VendorInput:
      type: object
      required: [branch_id, name, trade, phone]
      properties:
        branch_id: {type: integer}
        name: {type: string}
        trade: {type: string}
        phone: {type: string}
        email: {type: string, format: email}
        mpesa_number: {type: string}
        rating: {type: number, minimum: 0, maximum: 5}
        notes: {type: string}
    VendorUpdate:
      type: object
      properties:
        name: {type: string}
        trade: {type: string}
        phone: {type: string}
        email: {type: string, format: email}
        mpesa_number: {type: string}
        rating: {type: number, minimum: 0, maximum: 5}
        notes: {type: string}
        is_active: {type: boolean}
    MaintenanceQuotationInput:
      type: object
      required: [vendor_id, description, amount]
      properties:
        vendor_id: {type: integer}
        description: {type: string}
        amount: {type: number, exclusiveMinimum: 0}
        valid_until: {type: string, format: date}
    MaintenanceCostAllocationInput:
      type: object
      required: [target, amount]
      properties:
        target:
          type: string
          enum: [landlord, tenant]
        amount: {type: number, exclusiveMinimum: 0}
        reason: {type: string}
    InspectionInput:
      type: object
      required: [property_id, title, inspection_type, scheduled_for, responsible_staff_id]
      properties:
        property_id: {type: integer}
        unit_id: {type: integer, nullable: true}
        title: {type: string}
        inspection_type: {type: string}
        scheduled_for: {type: string, format: date-time}
        responsible_staff_id: {type: integer}
        checklist:
          type: array
          items: {type: object}
        photos:
          type: array
          items: {type: object}
    InspectionCompletionInput:
      type: object
      properties:
        checklist:
          type: array
          items: {type: object}
        photos:
          type: array
          items: {type: object}
        findings: {type: string}
        recommendations: {type: string}
    PropertyExpenseInput:
      type: object
      required: [property_id, category, description, amount, effective_from]
      properties:
        property_id: {type: integer}
        vendor_id: {type: integer, nullable: true}
        category: {type: string}
        description: {type: string}
        amount: {type: number, exclusiveMinimum: 0}
        recurrence:
          type: string
          enum: [one_off, monthly, quarterly, annual]
          default: one_off
        effective_from: {type: string, format: date}
        effective_to: {type: string, format: date, nullable: true}

openapi: 3.1.0
info:
  title: Legacy Real Estate Agency API
  version: 0.1.0
  contact:
    name: Legacy Real Estate API maintainers
  description: >
    Versioned API contract. The initial contract exposes the public service
    health endpoint; business endpoints are added with their authorization,
    validation, audit, and pagination requirements.

servers:
  - url: /api/v1
    description: Current API version

tags:
  - name: System
    description: Service health and operational endpoints.
  - name: Authentication
    description: Session sign-in and current-account endpoints.
  - name: Landlords
    description: Branch-scoped landlord records and management agreements.
  - name: Branches
    description: Branches accessible to the authenticated user.
  - name: Properties
    description: Branch-scoped properties and units.
  - name: Caretakers
    description: Caretaker accounts and property assignments.
  - name: Maintenance
    description: Property maintenance tickets, lifecycle updates, and comments.
  - name: Inspections
    description: Scheduled property inspections and landlord-shareable reports.
  - name: Expenses
    description: Recurring and one-off property expenses with approval workflows.
  - name: Announcements
    description: Branch and property notices for management staff and tenants.
  - name: Vendors
    description: Branch-scoped maintenance vendor and fundi records.
  - name: Tenancies
    description: Branch-scoped tenancy records and terms.
  - name: Billing
    description: Immutable invoices and financial records.
security:
  - SessionCookieAuth: []

paths:
  /health:
    get:
      operationId: getHealth
      summary: Health check
      description: Public liveness response. It contains no dependency or account data.
      tags:
        - System
      security: []
      responses:
        "200":
          description: Service is responding
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              examples:
                healthy:
                  value:
                    status: ok
  /auth/csrf:
    get:
      operationId: getAuthCsrfToken
      summary: Obtain a CSRF token
      description: Sets the CSRF cookie and returns its request-header token.
      tags:
        - Authentication
      security: []
      responses:
        "200":
          description: CSRF token issued
          content:
            application/json:
              schema:
                type: object
                required:
                  - csrfToken
                properties:
                  csrfToken:
                    type: string
  /auth/login:
    post:
      operationId: login
      summary: Start a session
      description: >
        Requires the CSRF cookie and X-CSRFToken header. Finance-role users
        must complete SMS verification before a session is established.
      tags:
        - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - identifier
                - password
              properties:
                identifier:
                  type: string
                  description: Email address or international-format mobile number.
                password:
                  type: string
                  format: password
      responses:
        "200":
          description: Signed in without an additional challenge
          content:
            application/json:
              schema:
                type: object
                required:
                  - user
                properties:
                  user:
                    $ref: "#/components/schemas/AuthUser"
        "202":
          description: SMS verification is required
          content:
            application/json:
              schema:
                type: object
                required:
                  - mfa_required
                  - challenge_id
                properties:
                  mfa_required:
                    type: boolean
                    const: true
                  challenge_id:
                    type: integer
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
  /auth/mfa/verify:
    post:
      operationId: verifyAuthSmsChallenge
      summary: Verify a sign-in code
      description: Requires the CSRF cookie and X-CSRFToken header.
      tags:
        - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - challenge_id
                - code
              properties:
                challenge_id:
                  type: integer
                code:
                  type: string
                  pattern: "^[0-9]{6}$"
      responses:
        "200":
          description: Challenge verified and session established
          content:
            application/json:
              schema:
                type: object
                required:
                  - user
                properties:
                  user:
                    $ref: "#/components/schemas/AuthUser"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
  /auth/me:
    get:
      operationId: getCurrentUser
      summary: Get the authenticated user
      description: Returns the account, role names, and branches available to the current session.
      tags:
        - Authentication
      responses:
        "200":
          description: Current account information
          content:
            application/json:
              schema:
                type: object
                required:
                  - user
                properties:
                  user:
                    $ref: "#/components/schemas/AuthUser"
        "401":
          $ref: "#/components/responses/Problem"
  /auth/logout:
    post:
      operationId: logout
      summary: End the current session
      description: Requires the session cookie and X-CSRFToken header.
      tags:
        - Authentication
      responses:
        "200":
          description: Session ended
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    const: ok
        "401":
          $ref: "#/components/responses/Problem"
  /auth/register-landlord:
    post:
      operationId: registerLandlordPortal
      summary: Register a landlord portal account
      description: Creates the Django account, landlord record, initial property, and session transactionally.
      tags:
        - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, email, phone, password, property_name]
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                phone:
                  type: string
                password:
                  type: string
                  format: password
                  minLength: 12
                property_name:
                  type: string
      responses:
        "201":
          description: Landlord account and initial property created
        "400":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /caretaker-invitations:
    get:
      operationId: listCaretakerInvitations
      summary: List caretaker invitations and assignments
      description: Returns invitations and active caretaker assignments limited to properties owned by the current landlord account.
      tags:
        - Caretakers
      parameters:
        - name: property_id
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Invitations and active caretaker assignments for owned properties
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
    post:
      operationId: createCaretakerInvitation
      summary: Create a caretaker invitation
      description: Returns a raw one-time activation token; only its hash is stored.
      tags:
        - Caretakers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [property_id, email]
              properties:
                property_id:
                  type: integer
                email:
                  type: string
                  format: email
      responses:
        "201":
          description: Invitation created and activation token returned
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /caretaker-invitations/verify:
    get:
      operationId: verifyCaretakerInvitation
      summary: Resolve a caretaker invitation
      description: Validates an unexpired, unused invitation token and returns its email and property context.
      tags:
        - Caretakers
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Invitation email and property context
        "400":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /caretaker-invitations/complete:
    post:
      operationId: activateCaretakerInvitation
      summary: Create and activate a caretaker account
      description: Consumes an invitation and transactionally creates the caretaker account and property assignment.
      tags:
        - Caretakers
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token, name, phone, password]
              properties:
                token:
                  type: string
                name:
                  type: string
                phone:
                  type: string
                password:
                  type: string
                  format: password
                  minLength: 12
      responses:
        "201":
          description: Caretaker account and property assignment created; session established
        "400":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /caretaker-invitations/{invitation_id}/resend:
    post:
      operationId: resendCaretakerInvitation
      summary: Regenerate a caretaker activation token
      description: Invalidates the previous link and returns a replacement token with a new 48-hour expiry.
      tags:
        - Caretakers
      parameters:
        - name: invitation_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: New one-time activation token returned
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /caretaker-invitations/revoke:
    post:
      operationId: revokeCaretakerPropertyAccess
      summary: End a caretaker's assignment to a property
      description: Ends the active assignment without deleting the caretaker account or its other assignments.
      tags:
        - Caretakers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [property_id, caretaker_id]
              properties:
                property_id:
                  type: integer
                caretaker_id:
                  type: integer
      responses:
        "200":
          description: Caretaker property assignment ended
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /branches:
    get:
      operationId: listAccessibleBranches
      summary: List accessible branches
      description: Returns only branches assigned to the authenticated user.
      tags:
        - Branches
      responses:
        "200":
          description: Accessible branches
          content:
            application/json:
              schema:
                type: object
                required:
                  - branches
                properties:
                  branches:
                    type: array
                    items:
                      $ref: "#/components/schemas/Branch"
        "401":
          $ref: "#/components/responses/Problem"
  /branches/{branch_id}:
    get:
      operationId: getAccessibleBranch
      summary: Get an accessible branch
      description: Returns a branch only when it is in the caller's access scope.
      tags:
        - Branches
      parameters:
        - name: branch_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Accessible branch
          content:
            application/json:
              schema:
                type: object
                required:
                  - branch
                properties:
                  branch:
                    $ref: "#/components/schemas/Branch"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /landlords:
    get:
      operationId: listLandlords
      summary: List accessible landlords
      description: Returns landlord records in the authenticated user's branch scope.
      tags:
        - Landlords
      responses:
        "200":
          description: Accessible landlord records
          content:
            application/json:
              schema:
                type: object
                required:
                  - landlords
                properties:
                  landlords:
                    type: array
                    items:
                      $ref: "#/components/schemas/Landlord"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
  /landlords/create:
    post:
      operationId: createLandlord
      summary: Create a landlord record
      description: Creates a landlord within a branch available to the authenticated user.
      tags:
        - Landlords
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LandlordInput"
      responses:
        "201":
          description: Landlord created
          content:
            application/json:
              schema:
                type: object
                required:
                  - landlord
                properties:
                  landlord:
                    $ref: "#/components/schemas/Landlord"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
  /landlords/{landlord_id}:
    get:
      operationId: getLandlord
      summary: Get an accessible landlord
      description: Returns a landlord only when it belongs to the authenticated user's branch scope.
      tags:
        - Landlords
      parameters:
        - name: landlord_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Accessible landlord
          content:
            application/json:
              schema:
                type: object
                required:
                  - landlord
                properties:
                  landlord:
                    $ref: "#/components/schemas/Landlord"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /landlords/{landlord_id}/agreements:
    post:
      operationId: createManagementAgreement
      summary: Add a management agreement
      description: Adds dated management terms to an accessible landlord record.
      tags:
        - Landlords
      parameters:
        - name: landlord_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManagementAgreementInput"
      responses:
        "201":
          description: Management agreement created
          content:
            application/json:
              schema:
                type: object
                required:
                  - agreement
                properties:
                  agreement:
                    $ref: "#/components/schemas/ManagementAgreement"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /properties:
    get:
      operationId: listProperties
      summary: List accessible properties
      description: Returns branch-scoped properties visible to the authenticated user.
      tags:
        - Properties
      responses:
        "200":
          description: Properties visible to the authenticated user
          content:
            application/json:
              schema:
                type: object
                required: [properties]
                properties:
                  properties:
                    type: array
                    items:
                      $ref: "#/components/schemas/Property"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
  /properties/create:
    post:
      operationId: createProperty
      summary: Create a property
      description: Creates a property within a branch accessible to the authenticated user.
      tags:
        - Properties
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PropertyInput"
      responses:
        "201":
          description: Property created
          content:
            application/json:
              schema:
                type: object
                properties:
                  property:
                    $ref: "#/components/schemas/Property"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
  /properties/{property_id}:
    get:
      operationId: getProperty
      summary: Get a property
      description: Returns one property when it is within the authenticated user's branch scope.
      tags:
        - Properties
      parameters:
        - name: property_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Property details
          content:
            application/json:
              schema:
                type: object
                properties:
                  property:
                    $ref: "#/components/schemas/Property"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /properties/{property_id}/blocks:
    post:
      operationId: createBlock
      summary: Add a block to a property
      description: Adds a uniquely named block to an accessible property.
      tags:
        - Properties
      parameters:
        - name: property_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
      responses:
        "201":
          description: Block created
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /caretakers/create:
    post:
      operationId: createCaretaker
      summary: Create a caretaker account
      tags:
        - Caretakers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaretakerInput"
      responses:
        "201":
          description: Caretaker account created
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /caretaker/dashboard:
    get:
      operationId: getCaretakerDashboard
      summary: Get the caretaker dashboard
      description: Returns assigned properties, unit status, pending readings, and pending move-in checklist items for the authenticated caretaker.
      tags:
        - Caretakers
      responses:
        "200":
          description: Caretaker dashboard
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
  /caretaker/meter-readings:
    post:
      operationId: createCaretakerMeterReadings
      summary: Record caretaker meter readings
      description: Atomically records up to 250 meter readings for units assigned to the authenticated caretaker.
      tags:
        - Caretakers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [readings]
              properties:
                readings:
                  type: array
                  minItems: 1
                  maxItems: 250
                  items:
                    $ref: "#/components/schemas/CaretakerMeterReadingInput"
      responses:
        "201":
          description: Meter readings recorded
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /maintenance-tickets:
    get:
      operationId: listMaintenanceTickets
      summary: List accessible maintenance tickets
      description: Returns maintenance tickets within the authenticated user's property scope.
      tags:
        - Maintenance
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [open, assigned, quotation, awaiting_landlord_approval, in_progress, completed, closed]
      responses:
        "200":
          description: Maintenance tickets
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
  /vendors:
    get:
      operationId: listVendors
      summary: List vendors
      description: Returns vendors in branches accessible to authorized property staff.
      tags:
        - Vendors
      parameters:
        - name: active
          in: query
          required: false
          schema: {type: boolean}
      responses:
        "200":
          description: Vendors
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
  /vendors/create:
    post:
      operationId: createVendor
      summary: Create a vendor
      description: Creates a branch-scoped vendor or fundi record.
      tags:
        - Vendors
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VendorInput"
      responses:
        "201":
          description: Vendor created
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
  /vendors/{vendor_id}:
    post:
      operationId: updateVendor
      summary: Update a vendor
      description: Updates vendor contact, trade, rating, notes, or active status.
      tags:
        - Vendors
      parameters:
        - name: vendor_id
          in: path
          required: true
          schema: {type: integer}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VendorUpdate"
      responses:
        "200":
          description: Vendor updated
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /maintenance-tickets/{ticket_id}/quotations:
    get:
      operationId: listMaintenanceQuotations
      summary: List ticket quotations
      description: Returns quotations and the active landlord approval threshold for an accessible maintenance ticket.
      tags:
        - Maintenance
      parameters:
        - name: ticket_id
          in: path
          required: true
          schema: {type: integer}
      responses:
        "200":
          description: Ticket quotations
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /maintenance-tickets/{ticket_id}/quotations/create:
    post:
      operationId: createMaintenanceQuotation
      summary: Submit a maintenance quotation
      description: Submits a vendor quotation for an accessible ticket.
      tags:
        - Maintenance
      parameters:
        - name: ticket_id
          in: path
          required: true
          schema: {type: integer}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaintenanceQuotationInput"
      responses:
        "201":
          description: Quotation submitted
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /maintenance-quotations/{quotation_id}/approval:
    post:
      operationId: approveMaintenanceQuotation
      summary: Approve or reject a maintenance quotation
      description: Applies agreement threshold authorization and records the approver or rejection reason.
      tags:
        - Maintenance
      parameters:
        - name: quotation_id
          in: path
          required: true
          schema: {type: integer}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                approved: {type: boolean, default: true}
                rejection_reason: {type: string}
      responses:
        "200":
          description: Quotation decision recorded
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /maintenance-quotations/{quotation_id}/allocations/create:
    post:
      operationId: createMaintenanceCostAllocation
      summary: Allocate approved maintenance cost
      description: Allocates part of an approved quotation to the property landlord or active tenant.
      tags:
        - Maintenance
      parameters:
        - name: quotation_id
          in: path
          required: true
          schema: {type: integer}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaintenanceCostAllocationInput"
      responses:
        "201":
          description: Cost allocation created
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /maintenance-tickets/create:
    post:
      operationId: createMaintenanceTicket
      summary: Create a maintenance ticket
      description: Creates a ticket for an accessible property or unit.
      tags:
        - Maintenance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaintenanceTicketInput"
      responses:
        "201":
          description: Maintenance ticket created
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /maintenance-tickets/{ticket_id}/status:
    post:
      operationId: updateMaintenanceTicketStatus
      summary: Update a maintenance ticket status
      description: Advances a ticket through the SRS maintenance lifecycle and optionally assigns a caretaker.
      tags:
        - Maintenance
      parameters:
        - name: ticket_id
          in: path
          required: true

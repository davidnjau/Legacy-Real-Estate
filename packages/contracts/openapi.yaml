    post:
      operationId: createLandlordMoveInSettlement
      summary: Reserve a unit for a new move-in
      description: Snapshots active recurring property charges and creates a payment-pending settlement for one vacant unit.
      tags:
        - Tenancies
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [unitId, tenantName, tenantEmail, tenantPhone, expectedMoveInDate, rentAmount]
              properties:
                unitId:
                  type: integer
                tenantName:
                  type: string
                tenantEmail:
                  type: string
                  format: email
                tenantPhone:
                  type: string
                expectedMoveInDate:
                  type: string
                  format: date
                depositAmount:
                  type: number
                  minimum: 0
                rentAmount:
                  type: number
                  exclusiveMinimum: 0
                garbageAmount:
                  type: number
                  minimum: 0
                waterDepositAmount:
                  type: number
                  minimum: 0
      responses:
        "201":
          description: Move-in settlement created
          content:
            application/json:
              schema:
                type: object
                required: [settlement]
                properties:
                  settlement:
                    $ref: "#/components/schemas/MoveInSettlement"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateLandlordMoveInSettlement
      summary: Record payment or send tenant activation
      description: Records a manual settlement payment or queues a tenant activation SMS after the settlement is fully paid.
      tags:
        - Tenancies
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [settlementId, amount]
                  properties:
                    settlementId:
                      type: integer
                    amount:
                      type: number
                      exclusiveMinimum: 0
                    mpesaReference:
                      type: string
                - type: object
                  required: [settlementId, sendActivationSMS]
                  properties:
                    settlementId:
                      type: integer
                    sendActivationSMS:
                      type: boolean
                      const: true
      responses:
        "200":
          description: Payment recorded or activation SMS queued
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [settlement, bookingConfirmed, activationReady]
                    properties:
                      settlement:
                        $ref: "#/components/schemas/MoveInSettlement"
                      bookingConfirmed:
                        type: boolean
                      activationReady:
                        type: boolean
                  - type: object
                    required: [success, message, settlement]
                    properties:
                      success:
                        type: boolean
                      message:
                        type: string
                      settlement:
                        type: object
                        required: [id, activation_sms_queued_at, activation_sms_error]
                        properties:
                          id: {type: integer}
                          activation_sms_queued_at: {type: [string, "null"], format: date-time}
                          activation_sms_error: {type: [string, "null"]}
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "502":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: cancelLandlordMoveInSettlement
      summary: Cancel an unactivated move-in reservation
      description: Cancels a reservation only if it has no linked tenant account or tenant activation challenge.
      tags:
        - Tenancies
      requestBody:
        required: true
        content:

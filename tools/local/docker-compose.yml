services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: legacy_core
      POSTGRES_USER: legacy
      POSTGRES_PASSWORD: legacy_local_only
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legacy -d legacy_core"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-legacy_worker}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-local-legacy-worker-only}
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:-local-only-development-cookie}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  core:
    build:
      context: ../../apps/core
    environment:
      DJANGO_SECRET_KEY: local-compose-only-change-before-sharing
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,core
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost:${WEBSITE_HOST_PORT:-3001}}
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3001
      AUTH_SMS_BACKEND: ${AUTH_SMS_BACKEND:-users.sms.ConsoleSMSBackend}
      SOFTLINK_SMS_API_URL: ${SOFTLINK_SMS_API_URL:-https://api.softlinksms.co.ke/api/v1/sms}
      SOFTLINK_SMS_API_KEY: ${SOFTLINK_SMS_API_KEY:-}
      SOFTLINK_SMS_TRAFFIC_CLASS: ${SOFTLINK_SMS_TRAFFIC_CLASS:-promotional}
      SOFTLINK_SMS_TIMEOUT_SECONDS: ${SOFTLINK_SMS_TIMEOUT_SECONDS:-10}
      POSTGRES_DB: legacy_core
      POSTGRES_USER: legacy
      POSTGRES_PASSWORD: legacy_local_only
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: amqp://${RABBITMQ_DEFAULT_USER:-legacy_worker}:${RABBITMQ_DEFAULT_PASS:-local-legacy-worker-only}@rabbitmq:5672//
      OBJECT_STORAGE_ENDPOINT_URL: http://minio:9000
      OBJECT_STORAGE_ACCESS_KEY: localminio
      OBJECT_STORAGE_SECRET_KEY: local-only-change-before-sharing
      OBJECT_STORAGE_BUCKET: legacy-private
      OBJECT_STORAGE_REGION: us-east-1
      OBJECT_STORAGE_AUTO_CREATE_BUCKET: "1"
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/v1/health', timeout=5)",
        ]
      interval: 10s
      timeout: 10s
      retries: 10

  move-in-occupancy-scheduler:
    build:
      context: ../../apps/core
    environment:
      DJANGO_SECRET_KEY: local-compose-only-change-before-sharing
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,core
      POSTGRES_DB: legacy_core
      POSTGRES_USER: legacy
      POSTGRES_PASSWORD: legacy_local_only
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
    command:
      - sh
      - -c
      - while true; do python manage.py sync_move_in_occupancy; sleep 86400; done
    depends_on:
      core:
        condition: service_healthy

  celery-worker:
    build:
      context: ../../apps/core
    environment:
      DJANGO_SECRET_KEY: local-compose-only-change-before-sharing
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,core
      POSTGRES_DB: legacy_core
      POSTGRES_USER: legacy
      POSTGRES_PASSWORD: legacy_local_only
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      CELERY_BROKER_URL: amqp://${RABBITMQ_DEFAULT_USER:-legacy_worker}:${RABBITMQ_DEFAULT_PASS:-local-legacy-worker-only}@rabbitmq:5672//
    command: celery -A config worker --loglevel=INFO
    depends_on:
      core:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  celery-beat:
    build:
      context: ../../apps/core
    environment:
      DJANGO_SECRET_KEY: local-compose-only-change-before-sharing
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,core
      POSTGRES_DB: legacy_core
      POSTGRES_USER: legacy
      POSTGRES_PASSWORD: legacy_local_only
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      CELERY_BROKER_URL: amqp://${RABBITMQ_DEFAULT_USER:-legacy_worker}:${RABBITMQ_DEFAULT_PASS:-local-legacy-worker-only}@rabbitmq:5672//
    command: celery -A config beat --loglevel=INFO
    depends_on:
      core:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  sms-worker:
    build:
      context: ../../apps/core
    environment:
      DJANGO_SECRET_KEY: local-compose-only-change-before-sharing
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,core
      AUTH_SMS_BACKEND: ${AUTH_SMS_BACKEND:-users.sms.ConsoleSMSBackend}
      SOFTLINK_SMS_API_URL: ${SOFTLINK_SMS_API_URL:-https://api.softlinksms.co.ke/api/v1/sms}
      SOFTLINK_SMS_API_KEY: ${SOFTLINK_SMS_API_KEY:-}
      SOFTLINK_SMS_TRAFFIC_CLASS: ${SOFTLINK_SMS_TRAFFIC_CLASS:-promotional}
      SOFTLINK_SMS_TIMEOUT_SECONDS: ${SOFTLINK_SMS_TIMEOUT_SECONDS:-10}
      POSTGRES_DB: legacy_core
      POSTGRES_USER: legacy
      POSTGRES_PASSWORD: legacy_local_only
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
    command: python manage.py dispatch_sms_deliveries --watch
    depends_on:
      core:
        condition: service_healthy

  website:
    image: node:20-alpine
    working_dir: /workspace
    command: sh -c "corepack enable && pnpm install --frozen-lockfile --prefer-offline --store-dir /workspace/.pnpm-store && pnpm --filter @legacy/website dev --webpack --hostname 0.0.0.0"
    volumes:
      - ../..:/workspace
      - "${COREPACK_CACHE_DIR:-${HOME}/.cache/node/corepack}:/corepack-cache"
      - pnpm_node_modules:/workspace/node_modules
      - website_node_modules:/workspace/apps/website/node_modules
    environment:
      COREPACK_HOME: /corepack-cache
      NEXT_PUBLIC_API_MODE: local
      NEXT_PUBLIC_API_BASE_URL: http://core:8000/api/v1
    ports:
      - "127.0.0.1:${WEBSITE_HOST_PORT:-3001}:3000"
    depends_on:
      core:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"

  minio:
    image: local/minio:RELEASE.2025-10-15T17-29-55Z
    build:
      context: .
      dockerfile: minio.Dockerfile
      args:
        MINIO_VERSION: RELEASE.2025-10-15T17-29-55Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: localminio
      MINIO_ROOT_PASSWORD: local-only-change-before-sharing
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  pnpm_node_modules:
  website_node_modules:
  minio_data:
